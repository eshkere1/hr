project_id = "bzsujgcsavopvgobqsus"

# Телеграм не умеет присылать JWT: он стучится обычным POST'ом. Если оставить
# проверку включённой, вебхук будет молча получать 401, а сообщения кандидатов
# — пропадать. Защита здесь другая и не менее надёжная: заголовок
# x-telegram-bot-api-secret-token, который функция проверяет первым делом.
[functions.telegram-webhook]
verify_jwt = false

# А сюда стучится сама Supabase (Database Webhook) и подставляет service_role
# в Authorization. Значит, проверку оставляем: эндпоинт умеет писать в
# Телеграм от имени компании, открывать его наружу незачем.
[functions.telegram-send]
verify_jwt = true

# Сюда обращается приложение от имени вошедшего человека. JWT нужен, чтобы
# внутри функции понять, кто просит: добавлять ботов может только
# суперпользователь, и проверяется это по базе, а не по слову клиента.
[functions.bot-register]
verify_jwt = true

# Подключение работодателя hh: вызывает браузер от имени вошедшего человека.
# Внутри проверяем, что это суперпользователь.
[functions.hh-oauth]
verify_jwt = true

# Публикация вакансий. Вызывает HR из интерфейса.
[functions.hh-publish]
verify_jwt = true

# Забор откликов. Вызывает и человек кнопкой, и планировщик по расписанию.
[functions.hh-sync]
verify_jwt = true

# Уборка файлов по очереди. Зовёт приложение от имени кадровика — значит,
# JWT нужен: внутри проверяется роль. Служебный ключ функция узнаёт сама.
[functions.storage-purge]
verify_jwt = true
