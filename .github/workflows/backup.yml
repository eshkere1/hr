# Ежедневная резервная копия базы.
#
# Бесплатный план Supabase копий не делает вовсе — ни ежедневных, ни
# восстановления на момент времени. Пока в базе демо-данные, терять нечего.
# С первым настоящим кандидатом одно неверное удаление становится
# необратимым, а «мы восстановим» превращается в «мы не восстановим».
#
# Задача спит, пока не заданы секреты, и не падает каждую ночь письмом
# «workflow failed» — молчит, пока ей нечего делать.
#
# Что задать в Settings → Secrets and variables → Actions:
#
#   DB_PASSWORD        пароль базы. Только он: адрес, порт, пользователя
#                      и имя базы секретить не от кого, они прописаны ниже.
#   BACKUP_PASSPHRASE  пароль шифрования выгрузки. Без него копия — это
#                      персональные данные, лежащие у стороннего хранилища
#                      открытым текстом.
#   S3_ACCESS_KEY      S3 Admin Access Key из панели Timeweb
#   S3_SECRET_KEY      S3 Admin Secret Key оттуда же
#
# Адрес хранилища и имя корзины секретами не являются — знание имени
# приватной корзины доступа к ней не даёт, — поэтому они прописаны ниже
# и вводить их не нужно. Если корзину заведёте другую, переопределите
# секретами S3_ENDPOINT и S3_BUCKET.
#
# Хранилище берите российское, если работаете с российскими кандидатами:
# выгрузка — это те же персональные данные, и правило об их размещении
# распространяется на неё так же, как на саму базу.
#
# Проверить восстановление нужно ОДИН РАЗ вручную, до того как понадобится:
#
#   gpg --decrypt rastim-2026-09-13.sql.gpg > dump.sql
#   psql -h <адрес запасной базы> -U postgres -d postgres -f dump.sql
#
# Копия, которую ни разу не разворачивали, — это надежда, а не копия.

name: Резервная копия базы

on:
  schedule:
    # 03:30 UTC — 06:30 по Москве. Ночная уборка в базе идёт в 03:17 и 03:42,
    # копию снимаем между ними, чтобы в выгрузке уже был результат первой.
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что есть чем работать
        id: check
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          S3_KEY: ${{ secrets.S3_ACCESS_KEY }}
        run: |
          if [ -z "$DB_PASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$S3_KEY" ]; then
            echo "Секреты не заданы — копия не снимается. Это не ошибка."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Снять выгрузку
        if: steps.check.outputs.ready == 'true'
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Пароль идёт отдельной переменной, а не внутри строки подключения.
          # Первая попытка была со строкой, и pg_dump споткнулся о символ «@»
          # в пароле: разборщик принял хвост пароля за адрес, а следующий
          # кусок — за номер порта. Хуже того, обрывок пароля попал в текст
          # ошибки, а логи открытого репозитория видны всем. PGPASSWORD на
          # части не разбирается и в сообщения об ошибках не попадает.
          #
          # Порт 5432 — session pooler. Через transaction pooler (6543)
          # pg_dump не работает, а прямое подключение к db.<ref>.supabase.co
          # доступно только по IPv6, которого у машин GitHub нет.
          #
          # Версия pg_dump должна быть не старше сервера, иначе он откажется
          # выгружать. Поэтому контейнер, а не то, что стоит на раннере.
          docker run --rm -e PGPASSWORD postgres:17-alpine \
            pg_dump --no-owner --no-privileges --clean --if-exists \
              -h aws-1-eu-west-1.pooler.supabase.com \
              -p 5432 \
              -U postgres.bzsujgcsavopvgobqsus \
              -d postgres \
            > dump.sql
          echo "Размер выгрузки: $(du -h dump.sql | cut -f1)"

      - name: Зашифровать
        if: steps.check.outputs.ready == 'true'
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              --output "rastim-$(date -u +%F).sql.gpg" dump.sql
          rm -f dump.sql

      - name: Отправить в хранилище
        if: steps.check.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-1
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || 'https://s3.twcstorage.ru' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'rastim-backups' }}
        run: |
          FILE="rastim-$(date -u +%F).sql.gpg"
          aws s3 cp "$FILE" "s3://$S3_BUCKET/backups/$FILE" --endpoint-url "$S3_ENDPOINT"
          echo "Копия отправлена: backups/$FILE"

      - name: Убрать копии старше 60 дней
        if: steps.check.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-1
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || 'https://s3.twcstorage.ru' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'rastim-backups' }}
        run: |
          # Хранить вечно — значит держать персональные данные дольше, чем
          # разрешено самим себе же в политике сроков. Два месяца достаточно,
          # чтобы заметить и откатить любую порчу данных.
          EDGE=$(date -u -d '60 days ago' +%F)
          aws s3 ls "s3://$S3_BUCKET/backups/" --endpoint-url "$S3_ENDPOINT" \
            | awk '{print $4}' | grep -E '^rastim-[0-9]{4}-[0-9]{2}-[0-9]{2}\.sql\.gpg$' \
            | while read -r f; do
                d=$(echo "$f" | sed -E 's/rastim-(.*)\.sql\.gpg/\1/')
                if [ "$d" \< "$EDGE" ]; then
                  aws s3 rm "s3://$S3_BUCKET/backups/$f" --endpoint-url "$S3_ENDPOINT"
                  echo "Убрал старую копию: $f"
                fi
              done
